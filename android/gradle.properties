org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
# Deliberately no org.gradle.java.home here. It is machine-specific, so a path
# committed to the repo breaks every machine that is not the one it came from.
# Set it in your own ~/.gradle/gradle.properties if Gradle cannot find your JDK.
