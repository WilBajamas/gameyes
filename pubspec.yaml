name: gaming_library_assessment_flutter
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.5 <4.0.0"

isar_version: &isar_version ^3.1.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # intl Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Routes
  go_router: ^13.1.0

  # Shared pref
  shared_preferences: ^2.2.2

  # Bloc
  flutter_bloc: ^8.1.1

  # Bloc Transformer
  bloc_concurrency: ^0.2.3

  # Dio
  dio: ^5.2.1+1
  pretty_dio_logger: ^1.3.1
  http_parser: ^4.0.2
  retrofit: ^4.1.0

  # Local db
  isar: *isar_version
  isar_flutter_libs: *isar_version

  # Either - Left or Right
  dartz: ^0.10.1

  # Json
  json_annotation: ^4.8.1

  # DI
  get_it: ^7.6.0
  injectable: ^2.1.2
  injectable_generator: ^2.1.6

  # Equate
  equatable: ^2.0.5

  # Lottie
  lottie: ^3.0.0
  # Flutter animation
  flutter_animate: ^4.5.0

  # Slidable
  flutter_slidable: ^3.1.0

  # Text scaler
  auto_size_text: ^3.0.0
  readmore: ^2.2.0

  # Shimmer loading
  skeletonizer: ^1.0.1

  scroll_snap_list: ^0.9.1
  scrollable_positioned_list: ^0.3.8
  percent_indicator: ^4.2.3

  # Network image
  cached_network_image: ^3.3.1

  # Font
  google_fonts: 6.1.0

  # Envied - Privatise file
  envied: ^0.5.3

  # Path provider
  path_provider: ^2.1.2

  # Mocking
  mockito: ^5.4.4
  http_mock_adapter: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Json
  json_serializable: ^6.6.2

  # Code generator
  build_runner: ^2.3.3

  # Testing
  bloc_test: ^9.1.6

  # Envied generator
  envied_generator: ^0.5.3

  # Retrofit generator
  retrofit_generator: ^8.1.0

  # Isar generator
  isar_generator: *isar_version

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
