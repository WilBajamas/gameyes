name: gaming_library_assessment_flutter
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

isar_version: &isar_version 3.3.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # intl Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Routes
  auto_route: ^11.1.0

  # Shared pref
  shared_preferences: ^2.5.5

  # Bloc
  flutter_bloc: ^9.1.1

  # Bloc Transformer
  bloc_concurrency: ^0.3.0

  # Dio
  dio: ^5.9.2
  http_parser: ^4.1.2
  retrofit: ^4.9.2

  # Logging
  logger: ^2.7.0
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.16

  # Local db
  isar_community:
    version: *isar_version

  isar_community_flutter_libs:
    version: *isar_version



  # freezed
  freezed_annotation: ^3.1.0

  # Json
  json_annotation: ^4.11.0

  # DI
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  injectable_generator: ^2.12.1

  # Equate
  equatable: ^2.0.7

  # UUID
  uuid: ^4.5.3

  # Lottie
  lottie: ^3.3.2
  # Flutter animation
  flutter_animate: ^4.5.2

  # WebView
  webview_flutter: ^4.14.1

  # Slidable
  flutter_slidable: ^4.0.3

  # Text scaler
  auto_size_text: ^3.0.0
  readmore: ^3.0.0

  # Shimmer loading
  skeletonizer: ^2.1.3



  # Network image
  cached_network_image: ^3.4.1

  # Freezed
  freezed: ^3.2.5

  # Font
  google_fonts: ^8.0.2

  # Envied - Privatise file
  envied: ^1.3.4 # TODO: To deprecate this package and use flutter_secure_storage

  # Path provider
  path_provider: ^2.1.5

  # Mocking
  mockito: ^5.6.4
  http_mock_adapter: ^0.6.1

  # Supabase
  supabase_flutter: ^2.16.0

  # Crash reporting
  sentry_flutter: ^9.26.0

  # App version, for the crash report tag
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Json
  json_serializable: ^6.13.1

  # Code generator
  build_runner: ^2.13.1

  # Testing
  bloc_test: ^10.0.0

  # Envied generator
  envied_generator: ^1.3.4

  # Retrofit generator
  retrofit_generator: ^10.2.5

  # Auto Route generator
  auto_route_generator: ^10.5.0

  # Isar generator
  isar_community_generator:
    version: *isar_version


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
flutter_intl:
  enabled: true
