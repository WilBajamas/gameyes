name: gaming_library_assessment_flutter
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # intl Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Bloc
  flutter_bloc: ^8.1.1

  # DI
  get_it: ^7.6.0
  injectable: ^2.1.2
  injectable_generator: ^2.1.6

  # Lottie
  lottie: ^3.0.0

  # Font
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  # Json
  json_serializable: ^6.6.2

  # Code generator
  build_runner: ^2.3.3

  # Testing
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
