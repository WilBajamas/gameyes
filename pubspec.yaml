name: gaming_library_assessment_flutter
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # intl Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Routes
  go_router: ^13.1.0

  # Shared pref
  shared_preferences: ^2.2.2

  # Bloc
  flutter_bloc: ^8.1.1

  # Bloc Transformer
  bloc_concurrency: ^0.2.3

  # Dio
  dio: ^5.2.1+1
  pretty_dio_logger: ^1.3.1
  http_parser: ^4.0.2

  # Either - Left or Right
  dartz: ^0.10.1

  # Json
  json_annotation: ^4.8.1

  # DI
  get_it: ^7.6.0
  injectable: ^2.1.2
  injectable_generator: ^2.1.6

  # Equate
  equatable: ^2.0.5

  # Lottie
  lottie: ^3.0.0

  # Shimmer loading
  skeletonizer: ^1.0.1

  # Network image
  cached_network_image: ^3.3.1

  # Font
  google_fonts: ^6.1.0

  # Envied - Privatise file
  envied: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  # Json
  json_serializable: ^6.6.2

  # Code generator
  build_runner: ^2.3.3

  # Testing
  bloc_test: ^9.1.5

  # Envied generator
  envied_generator: ^0.5.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
