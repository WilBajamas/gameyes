name: Staging Release

# Run from the Actions tab against develop. Builds the dev flavour in release
# mode and hands it to Firebase App Distribution.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Notes shown to testers in Firebase
        required: false
        type: string

jobs:
  release:
    name: Distribute to Firebase App Distribution
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          require-secrets: "true"
          api-key: ${{ secrets.API_KEY }}
          sentry-dsn: ${{ secrets.SENTRY_DSN }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}

      - run: flutter test

      - uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and distribute
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: bundle exec fastlane android staging
