name: Android release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Fastlane lane to run
        required: true
        type: choice
        options:
          - dev
          - prod
      build_number:
        description: Optional positive Android build number
        required: false
        type: string
      release_notes:
        description: Optional Firebase release notes for dev
        required: false
        type: string

jobs:
  release:
    name: Release Android ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      API_KEY: ${{ secrets.API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare release files
        shell: bash
        run: |
          printf 'API_KEY=%s\nSENTRY_DSN=%s\n' "$API_KEY" "$SENTRY_DSN" > secret.env

          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > dev.env
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > prod.env

          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_STORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$RUNNER_TEMP/upload-keystore.jks" > android/key.properties

          if [[ "${{ inputs.environment }}" == "dev" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
            printf 'FIREBASE_SERVICE_ACCOUNT_PATH=%s\n' "$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          else
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"
            printf 'PLAY_SERVICE_ACCOUNT_PATH=%s\n' "$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
          fi

      - name: Generate environment source
        run: dart run build_runner build --delete-conflicting-outputs --build-filter=lib/config/config_envied.g.dart

      - name: Run Fastlane
        run: bundle exec fastlane android "${{ inputs.environment }}"
