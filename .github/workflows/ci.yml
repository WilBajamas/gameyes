name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter

      - name: Check generated code is committed
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git add -A lib test
          git diff --cached --exit-code -- lib test

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android dev
            os: ubuntu-latest
            command: flutter build apk --release --flavor dev --target lib/main.dart
          - name: Android prod
            os: ubuntu-latest
            command: flutter build appbundle --release --flavor prod --target lib/main_prod.dart
          - name: iOS
            os: macos-latest
            command: flutter build ios --release --no-codesign --target lib/main.dart

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter

      - run: dart run build_runner build --delete-conflicting-outputs --build-filter=lib/config/config_envied.g.dart

      # No signing key on CI, so the release build type falls back to the debug
      # certificate. These artifacts are throwaway compile checks, not shippable.
      - run: ${{ matrix.command }}
