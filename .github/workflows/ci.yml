name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
        with:
          generate: all

      - name: Check generated code is committed
        run: |
          git add -A lib test
          git diff --cached --exit-code -- lib test

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # Both compile jobs only prove the code builds. flutter analyze already
  # covers main_prod.dart, and the release workflows do the real signed
  # release builds, so one Android flavour in debug is enough here.
  android:
    name: Compiles on Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
      - run: flutter build apk --debug --flavor dev --target lib/main.dart

  ios:
    name: Compiles on iOS
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
      - run: flutter build ios --debug --no-codesign --target lib/main.dart
